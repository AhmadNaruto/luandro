# Luandro NRP — Version Catalog
# All dependency versions are defined here.
# Phase 0.6: Build & Toolchain Specification

[versions]
# Build System
agp                 = "8.7.3"
kotlin              = "2.0.21"
gradle              = "8.9"

# Android
minSdk              = "21"
targetSdk           = "36"
compileSdk          = "36"
buildTools          = "36.0.0"

# NDK (single version for entire project)
ndk                 = "28.2.13676358"

# Testing
junit               = "4.13.2"
junitExt            = "1.2.1"

composeBom          = "2024.10.01"
activityCompose     = "1.9.3"
dokka               = "1.9.20"

[libraries]
junit               = { group = "junit",                       name = "junit",            version.ref = "junit"    }
junit-ext           = { group = "androidx.test.ext",           name = "junit",            version.ref = "junitExt" }
compose-bom         = { group = "androidx.compose",            name = "compose-bom",      version.ref = "composeBom" }
compose-material3   = { group = "androidx.compose.material3",  name = "material3" }
compose-ui          = { group = "androidx.compose.ui",         name = "ui" }
compose-ui-tooling  = { group = "androidx.compose.ui",         name = "ui-tooling-preview" }
activity-compose    = { group = "androidx.activity",           name = "activity-compose", version.ref = "activityCompose" }

[plugins]
android-application = { id = "com.android.application",         version.ref = "agp"    }
android-library     = { id = "com.android.library",            version.ref = "agp"    }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
dokka               = { id = "org.jetbrains.dokka",            version.ref = "dokka"  }
