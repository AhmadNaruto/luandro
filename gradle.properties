# Luandro NRP — gradle.properties
# Phase 0.6: Build configuration

# JVM memory for Gradle daemon
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m

# Parallel execution
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# Suppress warning: AGP 8.7.3 tested up to compileSdk 35, we use 36
android.suppressUnsupportedCompileSdk=36

# Suppress experimental feature warnings
android.experimental.legacyTransform.forceNonIncremental=false
